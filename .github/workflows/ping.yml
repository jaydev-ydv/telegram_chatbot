name: Wake up Render bot

on:
  schedule:
    # Offset from the top of the hour to avoid GitHub's busiest schedule minute.
    - cron: '3/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to bot
        run: curl -fSs --retry 2 --retry-delay 5 --retry-all-errors --max-time 120 -o /dev/null https://telegram-chatbot-1-8ub6.onrender.com/
